<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Reader</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <h1>QR Code Reader</h1>
    <p class="subtitle">Upload an image to decode its QR code</p>

    <div class="upload-area" id="uploadArea">
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/gif" hidden>
      <div class="upload-icon">📷</div>
      <p>Drop an image here or <span class="link">browse</span></p>
      <p class="hint">JPG, PNG or GIF, up to 4 MB</p>
    </div>

    <div id="preview" class="preview">
      <img id="previewImage" alt="Selected image">
      <button id="clearBtn" class="clear-btn">✕</button>
    </div>

    <button id="scanBtn" class="scan-btn" disabled>Scan QR Code</button>

    <div id="error" class="error"></div>

    <div id="result" class="result">
      <h3>Decoded Content</h3>
      <div id="resultText" class="result-text"></div>
      <button id="copyBtn" class="copy-btn">Copy to Clipboard</button>
    </div>

    <p class="footer">
      Powered by <a href="https://apiverve.com/marketplace/qrcodereader?utm_source=github&amp;utm_medium=template&amp;utm_campaign=qr-reader-html-tutorial" target="_blank" rel="noopener noreferrer">APIVerve QR Code Reader API</a>
    </p>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
